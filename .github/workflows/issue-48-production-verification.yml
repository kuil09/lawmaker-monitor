name: issue-48-production-verification

on:
  push:
    branches: [ops/issue-48-verification]
    paths: [.github/workflows/issue-48-production-verification.yml]

permissions:
  contents: read
  actions: write

jobs:
  dispatch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Verify corrected main and dispatch recovery runs
        run: |
          test "$(gh api "repos/$GH_REPO/git/ref/heads/main" --jq .object.sha)" = "2fbf84a5bb5768ea6c67244d560ab01fa93a5f8d"
          gh workflow run build-data.yml --repo "$GH_REPO" --ref main -f raw_source=latest_ingest -f ingest_run_id=34587689833
          gh workflow run ingest-live.yml --repo "$GH_REPO" --ref main
          gh workflow run mirror-property-disclosures.yml --repo "$GH_REPO" --ref main
          sleep 5
          gh run list --repo "$GH_REPO" --branch main --event workflow_dispatch --limit 10 --json databaseId,workflowName,headSha,status,conclusion,url,createdAt
