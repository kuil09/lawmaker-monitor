name: mirror-documents

on:
  workflow_dispatch:
    inputs:
      backfill_start_date:
        description: Optional cursor override in YYYY-MM-DD format
        required: false
        type: string
      backfill_windows:
        description: Number of seven-day backfill windows to process
        required: false
        default: "1"
        type: string
      max_downloads:
        description: Maximum unique documents to process
        required: false
        default: "500"
        type: string
      skip_recent:
        description: Skip the rolling recent-date window
        required: false
        default: false
        type: boolean
      include_appendices:
        description: Deprecated; official minutes catalogs do not publish appendix files
        required: false
        default: "false"
        type: choice
        options:
          - "false"
      retry_attempt:
        description: Automatic recovery attempt
        required: false
        default: "0"
        type: string
  schedule:
    - cron: "30 15 * * *"

concurrency:
  group: published-data-${{ vars.DATA_REPO || 'none' }}-${{ vars.DATA_REPO_BRANCH || 'main' }}
  queue: max
  cancel-in-progress: false

jobs:
  mirror-documents:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      actions: write
      contents: read
    env:
      DATA_REPO: ${{ vars.DATA_REPO }}
      DATA_REPO_BRANCH: ${{ vars.DATA_REPO_BRANCH }}
      DATA_REPO_PAT: ${{ secrets.DATA_REPO_PAT }}
      MIRROR_MODE: assembly_minutes_catalog
      MIRROR_SOURCE_ID: ${{ vars.MIRROR_SOURCE_ID || 'assembly-minutes' }}
      MIRROR_START_URL: https://record.assembly.go.kr/assembly/mnts/search/search.do
      MIRROR_READY_SELECTOR: ${{ vars.MIRROR_READY_SELECTOR }}
      MIRROR_ROW_SELECTOR: ${{ vars.MIRROR_ROW_SELECTOR }}
      MIRROR_TITLE_SELECTOR: ${{ vars.MIRROR_TITLE_SELECTOR }}
      MIRROR_LINK_SELECTOR: ${{ vars.MIRROR_LINK_SELECTOR }}
      MIRROR_LINK_ATTRIBUTE: ${{ vars.MIRROR_LINK_ATTRIBUTE }}
      MIRROR_DATE_SELECTOR: ${{ vars.MIRROR_DATE_SELECTOR }}
      MIRROR_NEXT_SELECTOR: ${{ vars.MIRROR_NEXT_SELECTOR }}
      MIRROR_MAX_PAGES: ${{ vars.MIRROR_MAX_PAGES }}
      MIRROR_MAX_DOWNLOADS: ${{ github.event_name == 'workflow_dispatch' && inputs.max_downloads || vars.MIRROR_MAX_DOWNLOADS || '500' }}
      MIRROR_DOWNLOAD_CONCURRENCY: ${{ vars.MIRROR_DOWNLOAD_CONCURRENCY || '4' }}
      MIRROR_ASSEMBLY_NO: ${{ vars.MIRROR_ASSEMBLY_NO || '22' }}
      MIRROR_PAGE_SIZE: ${{ vars.MIRROR_PAGE_SIZE || '100' }}
      MIRROR_PAGE_DELAY_MS: ${{ vars.MIRROR_PAGE_DELAY_MS }}
      MIRROR_TIMEOUT_MS: ${{ vars.MIRROR_TIMEOUT_MS || '60000' }}
      MIRROR_TIME_ZONE: ${{ vars.MIRROR_TIME_ZONE }}
      MIRROR_RECENT_DAYS: ${{ vars.MIRROR_RECENT_DAYS }}
      MIRROR_MIN_RECENT_DAYS: ${{ vars.MIRROR_MIN_RECENT_DAYS || '30' }}
      MIRROR_BACKFILL_START_DATE: ${{ vars.MIRROR_BACKFILL_START_DATE }}
      MIRROR_BACKFILL_DAYS: ${{ vars.MIRROR_BACKFILL_DAYS }}
      MIRROR_BACKFILL_CURSOR_OVERRIDE: ${{ github.event_name == 'workflow_dispatch' && inputs.backfill_start_date || '' }}
      MIRROR_BACKFILL_WINDOWS_PER_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.backfill_windows || vars.MIRROR_BACKFILL_WINDOWS_PER_RUN || '1' }}
      MIRROR_CATCHUP_WINDOWS_PER_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.backfill_windows || vars.MIRROR_CATCHUP_WINDOWS_PER_RUN || '2' }}
      MIRROR_SKIP_RECENT: ${{ github.event_name == 'workflow_dispatch' && inputs.skip_recent || 'false' }}
      MIRROR_INCLUDE_APPENDICES: "false"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Node, install dependencies, and build shared workspaces
        uses: ./.github/actions/setup-node-workspaces
        with:
          build-target: schemas-and-ingest

      - name: Cache Playwright browsers
        if: env.MIRROR_MODE != 'assembly_minutes_catalog'
        uses: actions/cache@v5
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ hashFiles('package-lock.json') }}

      - name: Install Playwright browser
        if: env.MIRROR_MODE != 'assembly_minutes_catalog'
        run: npx playwright install --with-deps chromium

      - name: Clone public data repository
        if: env.DATA_REPO != '' && env.DATA_REPO_PAT != ''
        run: |
          REPO_URL="https://x-access-token:${DATA_REPO_PAT}@github.com/${DATA_REPO}.git"
          TARGET_BRANCH="${DATA_REPO_BRANCH:-main}"

          if git ls-remote --exit-code --heads "${REPO_URL}" "${TARGET_BRANCH}" >/dev/null 2>&1; then
            git clone --depth 1 --branch "${TARGET_BRANCH}" "${REPO_URL}" published-data
          else
            git init published-data
            cd published-data
            git checkout -b "${TARGET_BRANCH}"
            git remote add origin "${REPO_URL}"
          fi

      - name: Mirror public documents into data repository
        if: env.DATA_REPO != '' && env.DATA_REPO_PAT != ''
        run: npm run mirror:documents --workspace @lawmaker-monitor/ingest
        env:
          DATA_REPO_DIR: published-data

      - name: Commit and push mirrored document changes
        if: env.DATA_REPO != '' && env.DATA_REPO_PAT != ''
        working-directory: published-data
        run: |
          TARGET_BRANCH="${DATA_REPO_BRANCH:-main}"
          "${GITHUB_WORKSPACE}/scripts/publish-data-repo.sh" \
            "${PWD}" \
            "${TARGET_BRANCH}" \
            "Mirror public documents" \
            raw \
            manifests

      - name: Upload mirror state artifact
        if: env.DATA_REPO != '' && env.DATA_REPO_PAT != ''
        uses: actions/upload-artifact@v6
        with:
          name: mirrored-document-state
          path: |
            published-data/raw/index/document_index.json
            published-data/manifests/document_mirror_state.json
          if-no-files-found: warn

      - name: Read mirror progress
        id: mirror-progress
        if: env.DATA_REPO != '' && env.DATA_REPO_PAT != ''
        run: |
          STATE_FILE="published-data/manifests/document_mirror_state.json"
          echo "pending_backfill=$(jq -r '.pendingBackfill // false' "${STATE_FILE}")" >> "${GITHUB_OUTPUT}"
          echo "backfill_advanced=$(jq -r '.backfillAdvanced // false' "${STATE_FILE}")" >> "${GITHUB_OUTPUT}"

      - name: Start minutes summaries
        if: env.DATA_REPO != '' && env.DATA_REPO_PAT != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow run summarize-minutes.yml \
            --ref "${{ github.event.repository.default_branch }}" \
            -f retry_attempt="0"

      - name: Continue pending minutes backfill
        if: >-
          steps.mirror-progress.outputs.pending_backfill == 'true' &&
          steps.mirror-progress.outputs.backfill_advanced == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow run mirror-documents.yml \
            --ref "${{ github.event.repository.default_branch }}" \
            -f backfill_windows="${MIRROR_CATCHUP_WINDOWS_PER_RUN}" \
            -f max_downloads="${MIRROR_MAX_DOWNLOADS}" \
            -f skip_recent=true \
            -f retry_attempt="0"

  retry-failed-mirror:
    needs: mirror-documents
    if: ${{ always() && needs.mirror-documents.result == 'failure' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: write
      contents: read
    steps:
      - name: Retry failed minutes mirror
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          CURRENT_RETRY_ATTEMPT: ${{ inputs.retry_attempt || '0' }}
          MAX_RETRY_ATTEMPTS: "3"
          BACKFILL_START_DATE: ${{ inputs.backfill_start_date || '' }}
          BACKFILL_WINDOWS: ${{ inputs.backfill_windows || '1' }}
          MAX_DOWNLOADS: ${{ inputs.max_downloads || vars.MIRROR_MAX_DOWNLOADS || '500' }}
          SKIP_RECENT: ${{ inputs.skip_recent || 'false' }}
        run: |
          if ! [[ "${CURRENT_RETRY_ATTEMPT}" =~ ^[0-9]+$ ]]; then
            echo "Invalid retry attempt: ${CURRENT_RETRY_ATTEMPT}" >&2
            exit 1
          fi

          NEXT_RETRY_ATTEMPT="$((CURRENT_RETRY_ATTEMPT + 1))"
          if [ "${NEXT_RETRY_ATTEMPT}" -gt "${MAX_RETRY_ATTEMPTS}" ]; then
            echo "Minutes mirror retry budget exhausted." >&2
            exit 1
          fi

          ARGS=(
            workflow run mirror-documents.yml
            --ref "${{ github.event.repository.default_branch }}"
            -f "backfill_windows=${BACKFILL_WINDOWS}"
            -f "max_downloads=${MAX_DOWNLOADS}"
            -f "skip_recent=${SKIP_RECENT}"
            -f "retry_attempt=${NEXT_RETRY_ATTEMPT}"
          )
          if [ -n "${BACKFILL_START_DATE}" ]; then
            ARGS+=(-f "backfill_start_date=${BACKFILL_START_DATE}")
          fi

          gh "${ARGS[@]}"
