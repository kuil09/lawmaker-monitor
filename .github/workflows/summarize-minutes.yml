name: summarize-minutes

on:
  workflow_dispatch:
    inputs:
      max_documents:
        description: Maximum transcript documents to summarize
        required: false
        default: "1"
        type: string
      max_groups:
        description: Maximum member-agenda groups to summarize
        required: false
        default: "8"
        type: string
      retry_attempt:
        description: Automatic recovery attempt
        required: false
        default: "0"
        type: string

concurrency:
  group: published-data-${{ vars.DATA_REPO || 'none' }}-${{ vars.DATA_REPO_BRANCH || 'main' }}
  queue: max
  cancel-in-progress: false

jobs:
  summarize-minutes:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      actions: write
      contents: read
    env:
      DATA_REPO: ${{ vars.DATA_REPO }}
      DATA_REPO_BRANCH: ${{ vars.DATA_REPO_BRANCH }}
      DATA_REPO_PAT: ${{ secrets.DATA_REPO_PAT }}
      LLAMA_CPP_RELEASE: ${{ vars.LLAMA_CPP_RELEASE || 'b10107' }}
      MINUTES_SUMMARY_MODEL: ${{ vars.MINUTES_SUMMARY_MODEL || 'LGAI-EXAONE/EXAONE-4.0-1.2B-GGUF:Q8_0' }}
      MINUTES_SUMMARY_CHAT_TEMPLATE_URL: ${{ vars.MINUTES_SUMMARY_CHAT_TEMPLATE_URL || 'https://huggingface.co/LGAI-EXAONE/EXAONE-4.0-1.2B-GGUF/resolve/162446400ea4596377a3ce1d3ddffa32971af0a6/chat_template.jinja' }}
      MINUTES_SUMMARY_MAX_DOCUMENTS: ${{ github.event_name == 'workflow_dispatch' && inputs.max_documents || vars.MINUTES_SUMMARY_MAX_DOCUMENTS || '1' }}
      MINUTES_SUMMARY_MAX_GROUPS: ${{ github.event_name == 'workflow_dispatch' && inputs.max_groups || vars.MINUTES_SUMMARY_MAX_GROUPS || '8' }}
      MINUTES_SUMMARY_CONCURRENCY: ${{ vars.MINUTES_SUMMARY_CONCURRENCY || '2' }}
      MINUTES_SUMMARY_REQUEST_TIMEOUT_MS: ${{ vars.MINUTES_SUMMARY_REQUEST_TIMEOUT_MS || '60000' }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Node and build shared workspaces
        uses: ./.github/actions/setup-node-workspaces
        with:
          build-target: schemas-and-ingest

      - name: Clone public data repository
        if: env.DATA_REPO != '' && env.DATA_REPO_PAT != ''
        run: |
          REPO_URL="https://x-access-token:${DATA_REPO_PAT}@github.com/${DATA_REPO}.git"
          TARGET_BRANCH="${DATA_REPO_BRANCH:-main}"
          git clone --depth 1 --branch "${TARGET_BRANCH}" "${REPO_URL}" published-data

      - name: Detect mirrored transcript inputs
        id: transcript-inputs
        if: env.DATA_REPO != '' && env.DATA_REPO_PAT != ''
        run: |
          if jq -e 'any(.items[]; (.transcriptRelativePath // "") != "")' published-data/raw/index/document_index.json >/dev/null; then
            echo "available=true" >> "${GITHUB_OUTPUT}"
          else
            echo "available=false" >> "${GITHUB_OUTPUT}"
          fi

      - name: Cache local model
        if: steps.transcript-inputs.outputs.available == 'true'
        uses: actions/cache@v5
        with:
          path: ~/.cache/llama.cpp
          key: llama-model-${{ runner.os }}-${{ env.MINUTES_SUMMARY_MODEL }}-v1

      - name: Install llama.cpp
        if: steps.transcript-inputs.outputs.available == 'true'
        run: |
          ARCHIVE="${RUNNER_TEMP}/llama.tar.gz"
          INSTALL_DIR="${RUNNER_TEMP}/llama"
          RELEASE_URL="https://github.com/ggml-org/llama.cpp/releases/download/${LLAMA_CPP_RELEASE}/llama-${LLAMA_CPP_RELEASE}-bin-ubuntu-x64.tar.gz"
          curl --fail --location --retry 3 "${RELEASE_URL}" --output "${ARCHIVE}"
          mkdir -p "${INSTALL_DIR}"
          tar -xzf "${ARCHIVE}" -C "${INSTALL_DIR}"
          LLAMA_SERVER_PATH="$(find "${INSTALL_DIR}" -type f -name llama-server -print -quit)"
          if [ -z "${LLAMA_SERVER_PATH}" ]; then
            echo "llama-server was not found in the release archive." >&2
            exit 1
          fi
          chmod +x "${LLAMA_SERVER_PATH}"
          echo "LLAMA_SERVER_PATH=${LLAMA_SERVER_PATH}" >> "${GITHUB_ENV}"

      - name: Start local summary model
        if: steps.transcript-inputs.outputs.available == 'true'
        run: |
          CHAT_TEMPLATE_ARGS=()
          if [ -n "${MINUTES_SUMMARY_CHAT_TEMPLATE_URL}" ]; then
            CHAT_TEMPLATE_PATH="${RUNNER_TEMP}/minutes-summary-chat-template.jinja"
            curl --fail --location --retry 3 \
              "${MINUTES_SUMMARY_CHAT_TEMPLATE_URL}" \
              --output "${CHAT_TEMPLATE_PATH}"
            CHAT_TEMPLATE_ARGS=(--chat-template-file "${CHAT_TEMPLATE_PATH}")
          fi

          nohup "${LLAMA_SERVER_PATH}" \
            -hf "${MINUTES_SUMMARY_MODEL}" \
            --host 127.0.0.1 \
            --port 8080 \
            --ctx-size 8192 \
            --threads 4 \
            --parallel "${MINUTES_SUMMARY_CONCURRENCY}" \
            --jinja \
            "${CHAT_TEMPLATE_ARGS[@]}" \
            >"${RUNNER_TEMP}/llama-server.log" 2>&1 &
          echo "$!" > "${RUNNER_TEMP}/llama-server.pid"

          for attempt in $(seq 1 180); do
            if curl --fail --silent http://127.0.0.1:8080/health >/dev/null; then
              exit 0
            fi
            sleep 2
          done

          tail -n 200 "${RUNNER_TEMP}/llama-server.log"
          exit 1

      - name: Summarize new member statements
        if: steps.transcript-inputs.outputs.available == 'true'
        run: npm run summarize:minutes --workspace @lawmaker-monitor/ingest
        env:
          DATA_REPO_DIR: published-data
          MINUTES_SUMMARY_ENDPOINT: http://127.0.0.1:8080/v1/chat/completions

      - name: Read summary progress
        id: summary-progress
        if: steps.transcript-inputs.outputs.available == 'true'
        run: |
          STATE_FILE="published-data/manifests/minutes_summary_state.json"
          echo "remaining_documents=$(jq -r '.remainingDocuments // 0' "${STATE_FILE}")" >> "${GITHUB_OUTPUT}"
          echo "documents_completed=$(jq -r '.documentsCompleted // 0' "${STATE_FILE}")" >> "${GITHUB_OUTPUT}"
          echo "groups_summarized=$(jq -r '.groupsSummarized // 0' "${STATE_FILE}")" >> "${GITHUB_OUTPUT}"

      - name: Show local summary model diagnostics
        if: failure() && steps.transcript-inputs.outputs.available == 'true'
        run: tail -n 200 "${RUNNER_TEMP}/llama-server.log"

      - name: Stop local summary model
        if: always() && steps.transcript-inputs.outputs.available == 'true'
        run: |
          if [ -f "${RUNNER_TEMP}/llama-server.pid" ]; then
            kill "$(cat "${RUNNER_TEMP}/llama-server.pid")" || true
          fi

      - name: Commit and push summary changes
        if: >-
          steps.transcript-inputs.outputs.available == 'true' &&
          env.DATA_REPO != '' &&
          env.DATA_REPO_PAT != ''
        working-directory: published-data
        run: |
          TARGET_BRANCH="${DATA_REPO_BRANCH:-main}"
          "${GITHUB_WORKSPACE}/scripts/publish-data-repo.sh" \
            "${PWD}" \
            "${TARGET_BRANCH}" \
            "Summarize Assembly minutes" \
            curated/minutes_summaries \
            exports/member_statement_summaries \
            exports/vote_minutes_opinions.json \
            manifests/minutes_summary_state.json

  retry-failed-summary:
    needs: summarize-minutes
    if: ${{ always() && needs.summarize-minutes.result == 'failure' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: write
      contents: read
    steps:
      - name: Retry failed summary batch
        env:
          GH_TOKEN: ${{ github.token }}
          CURRENT_RETRY_ATTEMPT: ${{ inputs.retry_attempt || '0' }}
          MAX_RETRY_ATTEMPTS: "3"
          MAX_DOCUMENTS: ${{ inputs.max_documents || vars.MINUTES_SUMMARY_MAX_DOCUMENTS || '1' }}
          MAX_GROUPS: ${{ inputs.max_groups || vars.MINUTES_SUMMARY_MAX_GROUPS || '8' }}
        run: |
          if ! [[ "${CURRENT_RETRY_ATTEMPT}" =~ ^[0-9]+$ ]]; then
            echo "Invalid retry attempt: ${CURRENT_RETRY_ATTEMPT}" >&2
            exit 1
          fi

          NEXT_RETRY_ATTEMPT="$((CURRENT_RETRY_ATTEMPT + 1))"
          if [ "${NEXT_RETRY_ATTEMPT}" -gt "${MAX_RETRY_ATTEMPTS}" ]; then
            echo "Minutes summary retry budget exhausted." >&2
            exit 1
          fi

          gh workflow run summarize-minutes.yml \
            --ref "${{ github.event.repository.default_branch }}" \
            -f max_documents="${MAX_DOCUMENTS}" \
            -f max_groups="${MAX_GROUPS}" \
            -f retry_attempt="${NEXT_RETRY_ATTEMPT}"
