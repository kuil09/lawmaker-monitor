name: summarize-minutes

on:
  schedule:
    - cron: "30 18 * * *"
    # Eight historical batches, every three hours (KST 02:15 through 23:15).
    - cron: "15 2,5,8,11,14,17,20,23 * * *"
    # Coalesce historical analyses and deployment twice daily (KST 09:45/21:45).
    - cron: "45 0,12 * * *"
  workflow_dispatch:
    inputs:
      run_mode:
        description: Standard recent work, bounded historical backfill, or analysis refresh only
        required: true
        default: standard
        type: choice
        options:
          - standard
          - backfill
          - refresh
      target_date:
        description: Korean calendar date to summarize in YYYY-MM-DD format
        required: false
        type: string
      max_documents:
        description: Maximum transcript documents to summarize
        required: false
        default: "20"
        type: string
      max_groups:
        description: Maximum member-agenda groups to summarize
        required: false
        default: "160"
        type: string
      retry_attempt:
        description: Automatic recovery attempt
        required: false
        default: "0"
        type: string

jobs:
  parallel-backfill:
    if: inputs.run_mode == 'backfill' || github.event.schedule == '15 2,5,8,11,14,17,20,23 * * *'
    uses: ./.github/workflows/minutes-backfill.yml
    permissions:
      actions: write
      contents: read
    secrets: inherit
    with:
      target_date: ${{ inputs.target_date || '' }}

  summarize-minutes:
    if: inputs.run_mode != 'backfill' && github.event.schedule != '15 2,5,8,11,14,17,20,23 * * *'
    concurrency:
      group: published-data-${{ vars.DATA_REPO || 'none' }}-${{ vars.DATA_REPO_BRANCH || 'main' }}
      queue: max
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: ${{ (inputs.run_mode == 'backfill' || github.event.schedule == '15 2,5,8,11,14,17,20,23 * * *') && 30 || 60 }}
    outputs:
      target_date: ${{ steps.summary-date.outputs.value }}
      run_mode: ${{ steps.mode.outputs.value }}
    permissions:
      actions: write
      contents: read
    env:
      MINUTES_SUMMARY_RUN_MODE: ${{ inputs.run_mode || (github.event.schedule == '15 2,5,8,11,14,17,20,23 * * *' && 'backfill') || (github.event.schedule == '45 0,12 * * *' && 'refresh') || 'standard' }}
      MINUTES_SUMMARY_MAX_DURATION_MS: "1200000"
      DATA_REPO: ${{ vars.DATA_REPO }}
      DATA_REPO_BRANCH: ${{ vars.DATA_REPO_BRANCH }}
      DATA_REPO_PAT: ${{ secrets.DATA_REPO_PAT }}
      LLAMA_CPP_RELEASE: ${{ vars.LLAMA_CPP_RELEASE || 'b10107' }}
      MINUTES_SUMMARY_MODEL: ${{ vars.MINUTES_SUMMARY_MODEL || 'LGAI-EXAONE/EXAONE-4.0-1.2B-GGUF:Q8_0' }}
      MINUTES_SUMMARY_CHAT_TEMPLATE_URL: ${{ vars.MINUTES_SUMMARY_CHAT_TEMPLATE_URL || 'https://huggingface.co/LGAI-EXAONE/EXAONE-4.0-1.2B-GGUF/resolve/162446400ea4596377a3ce1d3ddffa32971af0a6/chat_template.jinja' }}
      MINUTES_SUMMARY_TARGET_DATE: ${{ inputs.target_date }}
      MINUTES_SUMMARY_MAX_DOCUMENTS: ${{ github.event_name == 'workflow_dispatch' && inputs.max_documents || vars.MINUTES_SUMMARY_MAX_DOCUMENTS || '20' }}
      MINUTES_SUMMARY_MAX_GROUPS: ${{ github.event_name == 'workflow_dispatch' && inputs.max_groups || vars.MINUTES_SUMMARY_MAX_GROUPS || '160' }}
      MINUTES_SUMMARY_CONCURRENCY: ${{ vars.MINUTES_SUMMARY_CONCURRENCY || '4' }}
      MINUTES_SUMMARY_REQUEST_TIMEOUT_MS: ${{ vars.MINUTES_SUMMARY_REQUEST_TIMEOUT_MS || '60000' }}
    steps:
      - name: Resolve execution mode
        id: mode
        run: echo "value=${MINUTES_SUMMARY_RUN_MODE}" >> "${GITHUB_OUTPUT}"

      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Node and build shared workspaces
        uses: ./.github/actions/setup-node-workspaces
        with:
          build-target: schemas-and-ingest

      - name: Clone public data repository
        if: env.DATA_REPO != '' && env.DATA_REPO_PAT != ''
        run: |
          REPO_URL="https://x-access-token:${DATA_REPO_PAT}@github.com/${DATA_REPO}.git"
          TARGET_BRANCH="${DATA_REPO_BRANCH:-main}"
          git clone --depth 1 --branch "${TARGET_BRANCH}" "${REPO_URL}" published-data

      - name: Resolve Korean summary date
        id: summary-date
        if: env.DATA_REPO != '' && env.DATA_REPO_PAT != ''
        run: |
          TARGET_DATE="${MINUTES_SUMMARY_TARGET_DATE}"
          if [ -z "${TARGET_DATE}" ]; then
            TARGET_DATE="$(TZ=Asia/Seoul date +%F)"
          fi
          if ! [[ "${TARGET_DATE}" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}$ ]]; then
            echo "Invalid summary target date: ${TARGET_DATE}" >&2
            exit 1
          fi
          echo "MINUTES_SUMMARY_TARGET_DATE=${TARGET_DATE}" >> "${GITHUB_ENV}"
          echo "value=${TARGET_DATE}" >> "${GITHUB_OUTPUT}"

      - name: Repair ambiguous agenda bindings without model requests
        id: repair-agendas
        if: env.DATA_REPO != '' && env.DATA_REPO_PAT != '' && env.MINUTES_SUMMARY_RUN_MODE == 'standard'
        env:
          DATA_REPO_DIR: published-data
        run: |
          npm run summarize:minutes --workspace @lawmaker-monitor/ingest -- --rebind-agendas

      - name: Detect pending transcript inputs
        id: transcript-inputs
        if: env.DATA_REPO != '' && env.DATA_REPO_PAT != '' && env.MINUTES_SUMMARY_RUN_MODE != 'refresh'
        env:
          DATA_REPO_DIR: published-data
        run: |
          if [ "${{ github.event.schedule }}" = "30 18 * * *" ]; then
            RECOVER="$(node scripts/check-minutes-recovery.mjs published-data/manifests/minutes_summary_state.json)"
            if [ "${RECOVER}" != "true" ]; then
              echo "available=false" >> "${GITHUB_OUTPUT}"
              exit 0
            fi
          fi
          PENDING="$(npm run --silent summarize:minutes --workspace @lawmaker-monitor/ingest -- --check-pending)"
          if [ "${PENDING}" = "true" ]; then
            echo "available=true" >> "${GITHUB_OUTPUT}"
          else
            echo "available=false" >> "${GITHUB_OUTPUT}"
          fi

      - name: Reserve daily historical processing budget
        id: budget
        if: steps.transcript-inputs.outputs.available == 'true'
        run: |
          if [ "${MINUTES_SUMMARY_RUN_MODE}" = "backfill" ]; then
            node scripts/control-minutes-backfill.mjs reserve published-data
          else
            echo "admitted=true" >> "${GITHUB_OUTPUT}"
          fi

      - name: Cache local model
        if: steps.transcript-inputs.outputs.available == 'true' && steps.budget.outputs.admitted == 'true'
        uses: actions/cache@v5
        with:
          path: ~/.cache/llama.cpp
          key: llama-model-${{ runner.os }}-${{ env.MINUTES_SUMMARY_MODEL }}-v1

      - name: Install llama.cpp
        if: steps.transcript-inputs.outputs.available == 'true' && steps.budget.outputs.admitted == 'true'
        run: |
          ARCHIVE="${RUNNER_TEMP}/llama.tar.gz"
          INSTALL_DIR="${RUNNER_TEMP}/llama"
          RELEASE_URL="https://github.com/ggml-org/llama.cpp/releases/download/${LLAMA_CPP_RELEASE}/llama-${LLAMA_CPP_RELEASE}-bin-ubuntu-x64.tar.gz"
          curl --fail --location --retry 3 "${RELEASE_URL}" --output "${ARCHIVE}"
          mkdir -p "${INSTALL_DIR}"
          tar -xzf "${ARCHIVE}" -C "${INSTALL_DIR}"
          LLAMA_SERVER_PATH="$(find "${INSTALL_DIR}" -type f -name llama-server -print -quit)"
          if [ -z "${LLAMA_SERVER_PATH}" ]; then
            echo "llama-server was not found in the release archive." >&2
            exit 1
          fi
          chmod +x "${LLAMA_SERVER_PATH}"
          echo "LLAMA_SERVER_PATH=${LLAMA_SERVER_PATH}" >> "${GITHUB_ENV}"

      - name: Start local summary model
        if: steps.transcript-inputs.outputs.available == 'true' && steps.budget.outputs.admitted == 'true'
        run: |
          CHAT_TEMPLATE_ARGS=()
          if [ -n "${MINUTES_SUMMARY_CHAT_TEMPLATE_URL}" ]; then
            CHAT_TEMPLATE_PATH="${RUNNER_TEMP}/minutes-summary-chat-template.jinja"
            curl --fail --location --retry 3 \
              "${MINUTES_SUMMARY_CHAT_TEMPLATE_URL}" \
              --output "${CHAT_TEMPLATE_PATH}"
            CHAT_TEMPLATE_ARGS=(--chat-template-file "${CHAT_TEMPLATE_PATH}")
          fi

          nohup "${LLAMA_SERVER_PATH}" \
            -hf "${MINUTES_SUMMARY_MODEL}" \
            --host 127.0.0.1 \
            --port 8080 \
            --ctx-size 8192 \
            --threads 4 \
            --parallel "${MINUTES_SUMMARY_CONCURRENCY}" \
            --jinja \
            "${CHAT_TEMPLATE_ARGS[@]}" \
            >"${RUNNER_TEMP}/llama-server.log" 2>&1 &
          echo "$!" > "${RUNNER_TEMP}/llama-server.pid"

          for _attempt in $(seq 1 180); do
            if curl --fail --silent http://127.0.0.1:8080/health >/dev/null; then
              exit 0
            fi
            sleep 2
          done

          tail -n 200 "${RUNNER_TEMP}/llama-server.log"
          exit 1

      - name: Summarize new member statements
        id: summarize
        continue-on-error: true
        if: steps.transcript-inputs.outputs.available == 'true' && steps.budget.outputs.admitted == 'true'
        run: npm run summarize:minutes --workspace @lawmaker-monitor/ingest
        env:
          DATA_REPO_DIR: published-data
          MINUTES_SUMMARY_ENDPOINT: http://127.0.0.1:8080/v1/chat/completions

      - name: Read summary progress
        id: summary-progress
        if: steps.transcript-inputs.outputs.available == 'true' && steps.budget.outputs.admitted == 'true'
        run: |
          STATE_FILE="published-data/manifests/minutes_summary_state.json"
          {
            echo "remaining_documents=$(jq -r '.remainingDocuments // 0' "${STATE_FILE}")"
            echo "documents_completed=$(jq -r '.documentsCompleted // 0' "${STATE_FILE}")"
            echo "groups_summarized=$(jq -r '.groupsSummarized // 0' "${STATE_FILE}")"
          } >> "${GITHUB_OUTPUT}"

      - name: Show local summary model diagnostics
        if: failure() && steps.budget.outputs.admitted == 'true'
        run: tail -n 200 "${RUNNER_TEMP}/llama-server.log"

      - name: Stop local summary model
        if: always() && steps.budget.outputs.admitted == 'true'
        run: |
          if [ -f "${RUNNER_TEMP}/llama-server.pid" ]; then
            kill "$(cat "${RUNNER_TEMP}/llama-server.pid")" || true
          fi

      - name: Commit and push summary changes
        id: publish
        if: >-
          !cancelled() && (steps.budget.outputs.admitted == 'true' || steps.repair-agendas.outputs.changed == 'true') &&
          env.DATA_REPO != '' &&
          env.DATA_REPO_PAT != ''
        working-directory: published-data
        run: |
          TARGET_BRANCH="${DATA_REPO_BRANCH:-main}"
          if [ ! -f manifests/minutes_summary_history.json ]; then
            printf '{"batches":[]}\n' > manifests/minutes_summary_history.json
          fi
          "${GITHUB_WORKSPACE}/scripts/publish-data-repo.sh" \
            "${PWD}" \
            "${TARGET_BRANCH}" \
            "Summarize Assembly minutes" \
            curated/minutes_summaries \
            exports/member_statement_summaries \
            exports/vote_minutes_opinions.json \
            manifests/minutes_summary_state.json \
            manifests/minutes_summary_history.json

      - name: Detect deferred analysis updates
        id: analysis-refresh
        if: >-
          !cancelled() && env.MINUTES_SUMMARY_RUN_MODE != 'backfill' &&
          env.DATA_REPO != '' && env.DATA_REPO_PAT != '' &&
          (steps.publish.outcome == 'success' || steps.transcript-inputs.outputs.available != 'true')
        run: node scripts/control-minutes-backfill.mjs refresh published-data

      - name: Refresh analyses after published summaries
        if: ${{ !cancelled() && steps.analysis-refresh.outputs.needed == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh workflow run build-data.yml \
            --ref "${{ github.event.repository.default_branch }}" \
            -f raw_source=latest_ingest

      - name: Fail after preserving partial progress
        if: ${{ !cancelled() && steps.summarize.outcome == 'failure' }}
        run: exit 1

  retry-failed-summary:
    needs: summarize-minutes
    if: ${{ always() && needs.summarize-minutes.result == 'failure' && needs.summarize-minutes.outputs.run_mode == 'standard' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: write
      contents: read
    steps:
      - name: Retry failed summary batch
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          CURRENT_RETRY_ATTEMPT: ${{ inputs.retry_attempt || '0' }}
          MAX_RETRY_ATTEMPTS: "3"
          TARGET_DATE: ${{ needs.summarize-minutes.outputs.target_date || inputs.target_date }}
          MAX_DOCUMENTS: ${{ inputs.max_documents || vars.MINUTES_SUMMARY_MAX_DOCUMENTS || '20' }}
          MAX_GROUPS: ${{ inputs.max_groups || vars.MINUTES_SUMMARY_MAX_GROUPS || '160' }}
        run: |
          if ! [[ "${CURRENT_RETRY_ATTEMPT}" =~ ^[0-9]+$ ]]; then
            echo "Invalid retry attempt: ${CURRENT_RETRY_ATTEMPT}" >&2
            exit 1
          fi

          NEXT_RETRY_ATTEMPT="$((CURRENT_RETRY_ATTEMPT + 1))"
          if [ "${NEXT_RETRY_ATTEMPT}" -gt "${MAX_RETRY_ATTEMPTS}" ]; then
            echo "Minutes summary retry budget exhausted." >&2
            exit 1
          fi

          gh workflow run summarize-minutes.yml \
            --ref "${{ github.event.repository.default_branch }}" \
            -f target_date="${TARGET_DATE}" \
            -f max_documents="${MAX_DOCUMENTS}" \
            -f max_groups="${MAX_GROUPS}" \
            -f retry_attempt="${NEXT_RETRY_ATTEMPT}"
