name: issue-48-diagnostics

on:
  push:
    branches: [fix/actions-48]
    paths: [.github/workflows/issue-48-diagnostics.yml]

permissions:
  contents: write
  actions: read

jobs:
  validate-repair:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      TERM: dumb
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Apply checksum-verified repair and remove temporary transport
        run: |
          cat .github/issue-48.patch.{1,2,3}.b64 | base64 --decode | gzip --decompress > "$RUNNER_TEMP/issue48.patch"
          echo "72ddb100244904738b92475766a1e964930740a16dd20792f0de24d22113dc7f  $RUNNER_TEMP/issue48.patch" | sha256sum --check
          git apply --check "$RUNNER_TEMP/issue48.patch"
          git apply "$RUNNER_TEMP/issue48.patch"
          rm .github/issue-48.patch.{1,2,3}.b64 .github/workflows/issue-48-diagnostics.yml
          git add -A
          git diff --cached --check
          test "$(git write-tree)" = "b50592b49a6b6a1373b052840f0f66ac57b241a4"
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Validate corrected source on Node 24
        env:
          VITE_DATA_REPO_BASE_URL: http://127.0.0.1:4174
          SKIP_MEMBER_SHARE_GENERATION: "1"
        run: |
          npm run build --workspace @lawmaker-monitor/schemas
          npm run build --workspace @lawmaker-monitor/ingest
          npm run lint
          npm run format:check
          npm test
          npm run typecheck
          npm run build --workspace @lawmaker-monitor/web
          git add -A
          test "$(git write-tree)" = "b50592b49a6b6a1373b052840f0f66ac57b241a4"
      - name: Store verified source blobs without updating any branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p artifacts/repair
          python - <<'PY'
          import base64, json, os, pathlib, subprocess
          paths = subprocess.check_output(['git', 'diff', '--cached', '--name-only', '--diff-filter=ACM', '-z']).decode().strip('\0').split('\0')
          assert len(paths) == 21, paths
          tree = []
          for path in paths:
              content = pathlib.Path(path).read_bytes()
              expected = subprocess.check_output(['git', 'hash-object', path], text=True).strip()
              result = json.loads(subprocess.check_output(['gh', 'api', '--method', 'POST', f'repos/{os.environ["GITHUB_REPOSITORY"]}/git/blobs', '--input', '-'], input=json.dumps({'content': base64.b64encode(content).decode(), 'encoding': 'base64'}).encode()))
              assert result['sha'] == expected, path
              tree.append({'path': path, 'mode': '100644', 'type': 'blob', 'sha': expected})
          pathlib.Path('artifacts/repair/tree-elements.json').write_text(json.dumps(tree, indent=2))
          print('Verified 21 source blobs; expected final tree b50592b49a6b6a1373b052840f0f66ac57b241a4; no branch was updated.')
          PY
      - uses: actions/upload-artifact@v6
        with:
          name: issue-48-verified-tree
          path: artifacts/repair
          retention-days: 7
          if-no-files-found: error
      - name: Download exact failed-build input and existing public data
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh run download 34587689833 --repo "$GITHUB_REPOSITORY" --name raw-snapshot --dir artifacts/ingest
          git clone --depth 1 https://github.com/kuil09/lawmaker-monitor-data.git published-data
          mkdir -p artifacts/constituency-boundaries/current
          gh release download constituency-boundaries-v1 --repo kuil09/lawmaker-monitor-data --dir artifacts/constituency-boundaries/current --pattern '*.geojson' --pattern '*.json'
      - name: Replay full normalized build without publishing or optional live requests
        env:
          RAW_DIR: artifacts/ingest
          DATA_REPO_DIR: published-data
          OUTPUT_DIR: artifacts/recovery-build
          DATA_REPO_BASE_URL: https://kuil09.github.io/lawmaker-monitor-data/
          COLLECT_SPONSORSHIP_ACCOUNTS: "false"
        run: npm run build:data --workspace @lawmaker-monitor/ingest
      - name: Preserve replay diagnostics
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: issue-48-replay-diagnostics
          path: |
            artifacts/diagnostics
            artifacts/recovery-build/manifests
          retention-days: 7
          if-no-files-found: warn
