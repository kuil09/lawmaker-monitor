name: issue-48-diagnostics

on:
  push:
    branches: [fix/actions-48]
    paths: [.github/workflows/issue-48-diagnostics.yml]

permissions:
  contents: read

jobs:
  workspace:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Package source and installed dependencies for offline reproduction
        run: tar --exclude=.git --exclude=artifacts -czf "$RUNNER_TEMP/issue-48-workspace.tgz" .
      - uses: actions/upload-artifact@v6
        with:
          name: issue-48-workspace
          path: ${{ runner.temp }}/issue-48-workspace.tgz
          retention-days: 1
          if-no-files-found: error
