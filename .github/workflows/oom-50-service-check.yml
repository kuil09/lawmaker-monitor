name: oom-50-service-check
on:
  push:
    branches: [ops/oom-50-completion]
    paths: [.github/workflows/oom-50-service-check.yml]
permissions:
  contents: read
  actions: read
jobs:
  verify-service:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          ref: 0f8462b62cba9acd64e9d4c4a5cd2739baa82577
          persist-credentials: false
      - uses: ./.github/actions/setup-node-workspaces
        with:
          build-target: none
      - name: Require completed fresh build and post-build deployment
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: kuil09/lawmaker-monitor
        run: |
          gh run watch 34654781685 --repo "$GH_REPO" --exit-status --interval 30
          mkdir -p artifacts/service-check/chain
          gh run download 34654781685 --repo "$GH_REPO" --name oom-50-fresh-chain --dir artifacts/service-check/chain
          jq -e '.codeSha=="0f8462b62cba9acd64e9d4c4a5cd2739baa82577" and .ingestRunId=="34654031275" and .buildRunId=="34654902067"' artifacts/service-check/chain/chain.json
          jq -r '.dataSha' artifacts/service-check/chain/chain.json > artifacts/service-check/data-sha.txt
      - name: Verify final public manifest and top-level datasets
        run: |
          node --input-type=module <<'NODE'
          import { readFile, writeFile } from 'node:fs/promises';
          import { createHash } from 'node:crypto';
          import assert from 'node:assert/strict';
          const dir='artifacts/service-check';
          const sha=(await readFile(`${dir}/data-sha.txt`,'utf8')).trim();
          const base='https://kuil09.github.io/lawmaker-monitor-data/';
          async function get(url) { const r=await fetch(url,{signal:AbortSignal.timeout(30000)}); assert.equal(r.status,200,`${url}: ${r.status}`); return Buffer.from(await r.arrayBuffer()); }
          const expected=await get(`https://raw.githubusercontent.com/kuil09/lawmaker-monitor-data/${sha}/manifests/latest.json`);
          let actual;
          for(let attempt=0;attempt<40;attempt++) {
            actual=await get(`${base}manifests/latest.json?recovery50=${Date.now()}`);
            if(actual.equals(expected)) break;
            if(attempt===39) throw new Error('Published manifest did not converge to committed data');
            await new Promise(r=>setTimeout(r,15000));
          }
          assert.ok(actual.equals(expected));
          const manifest=JSON.parse(actual);
          const checks=[];
          for(const [key,entry] of Object.entries(manifest.exports)) {
            const bytes=await get(new URL(entry.path,base));
            assert.equal(createHash('sha256').update(bytes).digest('hex'),entry.checksumSha256,`${key} checksum`);
            JSON.parse(bytes);
            checks.push({key,path:entry.path,bytes:bytes.length,checksumVerified:true});
          }
          for(const [key,entry] of Object.entries(manifest.datasets)) {
            const r=await fetch(new URL(entry.path,base),{method:'HEAD',signal:AbortSignal.timeout(30000)});
            assert.equal(r.status,200,`${key} Parquet status`);
            checks.push({key,path:entry.path,status:r.status,rowCount:entry.rowCount});
          }
          const result={checkedAt:new Date().toISOString(),dataSha:sha,snapshotId:manifest.snapshotId,updatedAt:manifest.updatedAt,checks};
          await writeFile(`${dir}/public-data.json`,JSON.stringify(result,null,2));
          console.log(JSON.stringify(result,null,2));
          NODE
      - name: Inspect final live home, calendar, comparison and map
        run: |
          export RECOVERY_CHROME="$(command -v google-chrome || command -v chromium)"
          node --input-type=module <<'NODE'
          import { chromium } from 'playwright';
          import { readFile, writeFile } from 'node:fs/promises';
          import assert from 'node:assert/strict';
          import { resolveProductionUiRoutes } from './scripts/resolve-production-ui-routes.mjs';
          const routes=await resolveProductionUiRoutes({fetchImpl:(url,init={})=>fetch(url,{...init,signal:AbortSignal.timeout(30000)})});
          const publicData=JSON.parse(await readFile('artifacts/service-check/public-data.json','utf8'));
          assert.equal(routes.snapshotId,publicData.snapshotId);
          const browser=await chromium.launch({headless:true,executablePath:process.env.RECOVERY_CHROME,args:['--no-sandbox','--disable-dev-shm-usage']});
          const results=[];
          try {
            for(const [name,url] of [['home',routes.appBaseUrl],['calendar',routes.single.url],['compare',routes.compare.url],['map',`${routes.appBaseUrl}#map`]]) {
              const page=await browser.newPage({viewport:{width:1440,height:1000}});
              const errors=[],failedData=[];
              page.on('pageerror',e=>errors.push(e.message));
              page.on('response',r=>{if(r.url().includes('kuil09.github.io/lawmaker-monitor-data/') && r.status()>=400) failedData.push({url:r.url(),status:r.status()});});
              const result={name,url,pageErrors:errors,failedData};
              results.push(result);
              try {
                const response=await page.goto(url,{waitUntil:'domcontentloaded',timeout:45000});
                result.status=response.status();
                assert.equal(response.status(),200);
                await page.waitForFunction(()=>document.querySelector('main')?.innerText.length>100,{},{timeout:45000});
                await page.waitForTimeout(5000);
                result.text=(await page.locator('main').innerText()).slice(0,2500);
                result.fontStatus=await page.evaluate(()=>document.fonts.status);
              } catch(error) { result.failure=String(error); }
              // Capture the actual viewport via CDP; do not block functional checks on document.fonts.ready.
              const session=await page.context().newCDPSession(page);
              const shot=await session.send('Page.captureScreenshot',{format:'png',captureBeyondViewport:false});
              await writeFile(`artifacts/service-check/${name}.png`,Buffer.from(shot.data,'base64'));
              await session.detach();
              await page.close();
            }
          } finally { await browser.close(); await writeFile('artifacts/service-check/browser.json',JSON.stringify({checkedAt:new Date().toISOString(),snapshotId:routes.snapshotId,captureMethod:'CDP viewport, no font-readiness wait',results},null,2)); }
          assert.equal(results.length,4);
          for(const r of results){ assert.equal(r.failure,undefined,`${r.name}: ${r.failure}`); assert.equal(r.pageErrors.length,0,`${r.name}: ${r.pageErrors.join('; ')}`); assert.equal(r.failedData.length,0,`${r.name}: failed published data`); }
          console.log(JSON.stringify(results.map(({name,pageErrors,failedData,fontStatus})=>({name,pageErrors,failedData,fontStatus})),null,2));
          NODE
      - name: Retain final acceptance evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: oom-50-final-service-check
          path: artifacts/service-check
          retention-days: 7
          if-no-files-found: warn
