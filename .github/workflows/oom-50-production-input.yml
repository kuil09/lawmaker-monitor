name: oom-50-production-input
on:
  push:
    branches: [ops/oom-50-validation]
    paths: [.github/workflows/oom-50-production-input.yml]
permissions:
  contents: read
  actions: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          ref: 3602ed31dc6e658377ba178c5fdc66333125aa82
      - name: Verify tested source tree
        run: test "$(git rev-parse HEAD^{tree})" = "70d44dd48c85ae09a6731d7ca7362c518a462716"
      - uses: ./.github/actions/setup-node-workspaces
        with:
          build-target: schemas-and-ingest
      - name: Fetch pinned production inputs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p artifacts/ingest artifacts/constituency-boundaries/current artifacts/diagnostics
          gh run download 34638768827 --name raw-snapshot --dir artifacts/ingest
          git init published-data
          git -C published-data remote add origin https://github.com/kuil09/lawmaker-monitor-data.git
          git -C published-data fetch --depth 1 origin 5c83899b686214e828c4054a6c2fb047edab91f8
          git -C published-data checkout --detach FETCH_HEAD
          test "$(git -C published-data rev-parse HEAD)" = "5c83899b686214e828c4054a6c2fb047edab91f8"
          gh release download constituency-boundaries-v1 --repo kuil09/lawmaker-monitor-data --dir artifacts/constituency-boundaries/current --pattern '*.geojson' --pattern '*.json'
          sha256sum artifacts/constituency-boundaries/current/* > artifacts/diagnostics/boundary-checksums.txt
      - name: Full data build including live sponsorship
        env:
          RAW_DIR: artifacts/ingest
          DATA_REPO_DIR: published-data
          OUTPUT_DIR: artifacts/build
          INGEST_RUN_ID: '34638768827'
          DATA_REPO_BASE_URL: https://kuil09.github.io/lawmaker-monitor-data/
          COLLECT_SPONSORSHIP_ACCOUNTS: 'true'
          NODE_OPTIONS: --max-old-space-size=4096
        run: bash scripts/run-data-build.sh
      - name: Materialize Parquet without publication
        run: |
          curl --fail --location --retry 2 https://github.com/duckdb/duckdb/releases/download/v1.1.3/duckdb_cli-linux-amd64.zip -o "$RUNNER_TEMP/duckdb.zip"
          unzip -o "$RUNNER_TEMP/duckdb.zip" -d "$RUNNER_TEMP/duckdb-cli"
          chmod +x "$RUNNER_TEMP/duckdb-cli/duckdb"
          cd artifacts/build
          mkdir -p curated
          "$RUNNER_TEMP/duckdb-cli/duckdb" :memory: -c '.read ../../packages/ingest/sql/materialize_parquet.sql'
      - name: Record complete output fingerprints
        run: |
          node --input-type=module <<'NODE'
          import { createReadStream } from 'node:fs';
          import { readFile, readdir, stat, writeFile } from 'node:fs/promises';
          import { join, relative } from 'node:path';
          import { createHash } from 'node:crypto';
          const root='artifacts/build';
          const files=[];
          async function visit(dir) {
            for (const name of await readdir(dir)) {
              const path=join(dir,name), info=await stat(path);
              if(info.isDirectory()) await visit(path);
              else {const hash=createHash('sha256'); for await(const chunk of createReadStream(path)) hash.update(chunk); files.push({path:relative(root,path),bytes:info.size,sha256:hash.digest('hex')});}
            }
          }
          await visit(root);
          JSON.parse(await readFile(join(root,'manifests/latest.json'),'utf8'));
          await writeFile('artifacts/diagnostics/output-files.json',JSON.stringify(files,null,2));
          NODE
      - name: Save full-input diagnostics even after failure
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: oom-50-production-input-diagnostics
          path: artifacts/diagnostics
          retention-days: 7
          if-no-files-found: warn
